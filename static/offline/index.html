<!doctype html>
<html lang="id" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Halaman offline DonghuaBatch untuk membuka katalog dan pencarian yang tersimpan di perangkat.">
  <meta name="theme-color" content="#060816">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.webp" type="image/webp">
  <title>Offline | DonghuaBatch</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1rem;
      background:
        radial-gradient(circle at 12% 0%, rgba(34, 211, 238, 0.14), transparent 32%),
        radial-gradient(circle at 92% 100%, rgba(139, 92, 246, 0.14), transparent 36%),
        #060816;
      color: #eef7ff;
    }
    main {
      width: min(100%, 36rem);
      padding: clamp(1rem, 5vw, 1.65rem);
      border: 1px solid rgba(125, 211, 252, 0.24);
      border-radius: 1.4rem;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.98), rgba(7, 10, 24, 0.99));
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
    }
    .brand {
      width: 5rem;
      height: 5rem;
      margin: 0 auto 1rem;
      border: 1px solid rgba(34, 211, 238, 0.34);
      border-radius: 999px;
      background: transparent;
      box-shadow: 0 0 24px rgba(34, 211, 238, 0.12);
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      min-height: 2rem;
      padding: 0.4rem 0.7rem;
      border: 1px solid rgba(34, 211, 238, 0.24);
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.08);
      color: #a5f3fc;
      font-size: 0.72rem;
      font-weight: 850;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h1 { margin: 0.9rem 0 0; color: #f8fbff; font-size: clamp(1.6rem, 7vw, 2.25rem); line-height: 1.08; }
    p { max-width: 30rem; margin: 0.75rem auto 0; color: #9fb1c9; font-size: 0.92rem; line-height: 1.65; }
    .actions { display: grid; grid-template-columns: 1fr; gap: 0.65rem; margin-top: 1.2rem; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.72rem 1rem;
      border: 1px solid rgba(125, 211, 252, 0.2);
      border-radius: 0.85rem;
      color: #eef7ff;
      background: rgba(255, 255, 255, 0.05);
      font-size: 0.86rem;
      font-weight: 850;
      text-decoration: none;
    }
    a:first-child { border-color: rgba(34, 211, 238, 0.3); background: linear-gradient(135deg, rgba(34, 211, 238, 0.16), rgba(139, 92, 246, 0.14)); }
    a:focus-visible { outline: 3px solid rgba(103, 232, 249, 0.7); outline-offset: 3px; }
    #connection-status { min-height: 1.3rem; color: #86efac; font-size: 0.78rem; font-weight: 750; }
    @media (min-width: 480px) { .actions { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (prefers-reduced-motion: no-preference) { a { transition: transform 0.18s ease, border-color 0.18s ease; } a:hover { transform: translateY(-2px); border-color: rgba(103, 232, 249, 0.5); } }
  </style>
</head>
<body>
  <main>
    <img class="brand" src="/icons/icon-192.webp" width="80" height="80" alt="Logo DonghuaBatch">
    <span class="kicker">Mode Offline</span>
    <h1>Kamu sedang offline</h1>
    <p>Halaman ini belum tersimpan. Buka katalog atau cari judul yang sudah tersimpan di perangkat.</p>
    <div class="actions">
      <a href="/">Buka Katalog</a>
      <a href="/search/">Cari Donghua</a>
    </div>
    <p id="connection-status" role="status" aria-live="polite"></p>
  </main>
  <script>
    (function () {
      var status = document.getElementById('connection-status');
      function syncConnection() {
        status.textContent = navigator.onLine ? 'Koneksi tersedia. Muat ulang halaman yang kamu perlukan.' : '';
      }
      window.addEventListener('online', syncConnection);
      window.addEventListener('offline', syncConnection);
      syncConnection();
    }());
  </script>
</body>
</html>
