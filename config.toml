baseURL = 'https://donghuabatch.com/'
title = 'DonghuaBatch - Tempatnya Download Batch Donghua Subtitle Indonesia'
defaultContentLanguage = 'id'
timeZone = 'Asia/Jakarta'

# Tanggal update otomatis mengikuti commit git terakhir tiap berkas konten.
enableGitInfo = true

# Urutan pencarian lastmod: field `updated` (kalau diisi manual), lalu
# `lastmod` di front matter, lalu commit git, lalu tanggal terbit.
[frontmatter]
    lastmod = ['updated', 'lastmod', ':git', 'date', 'publishDate']

[services]
    [services.googleAnalytics]
        id = 'G-7B40JB824Z'

[taxonomies]
    genres = 'genre'
    studios = 'studio'
    seasons = 'season'

[markup.goldmark.renderer]
    unsafe = true

[params]
    deskripsi = 'Tempat Download Batch Donghua subtitle Indonesia'
    keywords = 'Donghua, Batch, Subtitle Indonesia'
    author = 'Admin'
    img = '/img/DonghuaBatch.webp'
    disqusShortname = 'mydonghua'
    formspreeRequestDonatur = 'https://formspree.io/f/xregejlg'
    formspreeRequestUmum = 'https://formspree.io/f/xregejlg'
    formspreeDmca = 'https://formspree.io/f/xregejlg'

[sitemap]
    changeFreq = 'weekly'
    priority = 0.8

[pagination]
    disableAliases = true

[outputs]
    home = ['HTML', 'rss', 'json']
    section = ['HTML']
    taxonomy = ['HTML']
    term = ['HTML']

# Hugo Modules: static/img juga dibuka sebagai assets/img supaya resources.Get
# bisa membaca gambar apa adanya (misalnya lebar dan tinggi) tanpa menyalin
# berkas ke assets/. Mount untuk komponen assets menggantikan mount bawaan
# assets, jadi folder assets ditulis ulang di sini. Mount bawaan lain tetap aktif.
[module]
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"