baseURL = 'https://donghuabatch.com/'
title = 'DonghuaBatch - Tempatnya Download Batch Donghua Subtitle Indonesia'
defaultContentLanguage = 'id'
uglyURLs = false

[services]
    [services.googleAnalytics]
        id = 'G-7B40JB824Z'
    [services.rss]
        limit = -1

[taxonomies]
    genres = 'genre'
    studios = 'studio'
    seasons = 'season'

[markup.goldmark.renderer]
    unsafe = true

[params]
    deskripsi = 'Tempat Download Batch Donghua subtitle Indonesia'
    keywords = 'Donghua, Batch, Subtitle Indonesia'
    author = 'Admin'
    img = '/img/DonghuaBatch.webp'

# Social Bar Adsterra — overlay yang dirender sendiri oleh jaringan iklan.
# src        : URL script Social Bar dari dashboard Adsterra
# enabled    : matikan cepat tanpa menghapus partial
# delayMs    : jeda maksimal sebelum script dimuat (fallback dari idle callback)
# offsetPx   : perkiraan tinggi overlay, dipakai menaikkan Back to Top + floating ad
# excludePaths: awalan path halaman yang tidak memuat Social Bar
[params.socialBar]
    enabled = true
    src = 'https://bendspecimen.com/ac/c8/ec/acc8ecf445c142c2f16e5d0ab706e492.js'
    delayMs = 3500
    offsetPx = 56
    excludePaths = ['/privacy-policy/', '/terms-of-conditions/', '/about/', '/cara-melewati-safelinku/']

[sitemap]
    changeFreq = 'weekly'
    priority = 0.8

[pagination]
    disableAliases = true

[outputs]
    home = ['HTML', 'rss', 'json']
    section = ['HTML']
    taxonomy = ['HTML']
    term = ['HTML']

# Hugo Modules – mount static/img to assets/img
# Supaya resources.Get bisa proses thumbnail di static/img/post/
# tanpa perlu copy manual ke assets/img/post/
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  # Mount tambahan: expose static/img ke assets/img untuk Hugo Pipes
  [[module.mounts]]
    source = "static/img"
    target = "assets/img"

[minify]
  disableJS = false