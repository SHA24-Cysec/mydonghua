{{/* Kotak password arsip batch. Hanya dirender bila front matter punya field password terisi. */}}
{{- $password := trim (string (.Params.password | default "")) " " -}}
{{- with $password }}
<div class="db-pass" data-pass-box>
    <div class="db-pass-head">
        <span class="db-pass-icon" aria-hidden="true"><i class="fa-solid fa-lock"></i></span>
        <div class="db-pass-body">
            <span class="db-pass-label">Password Arsip</span>
            <p class="db-pass-note">File batch terkunci. Pakai password ini saat mengekstrak.</p>
        </div>
    </div>
    <div class="db-pass-action">
        <code class="db-pass-value" data-pass-value>{{ . }}</code>
        <button class="db-pass-copy" type="button" data-pass-copy data-pass-text="{{ . }}" aria-label="Salin password {{ . }}">
            <i class="fa-regular fa-copy" aria-hidden="true"></i>
            <span class="db-pass-copy-text">Salin</span>
        </button>
    </div>
</div>
{{- end }}
