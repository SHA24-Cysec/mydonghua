<div class="panel-neon p-3 sm:p-5">
    <div class="flex items-center justify-center gap-3">
        <div class="bg-linear-to-r from-cyan-500 via-blue-600 to-purple-600 p-px rounded-xl shadow-neon-cyan-xl" id="buka-komen">
            <button class="cursor-pointer bg-cyber-card hover:bg-cyber-dark text-cyan-300 hover:text-white px-6 py-2.5 font-bold rounded-xl transition-colors duration-200 flex items-center gap-2" type="button">
                <i class="fa-regular fa-comments"></i>
                Buka Komentar
            </button>
        </div>
        <div class="hidden bg-linear-to-r from-pink-500 via-red-500 to-orange-500 p-px rounded-xl shadow-neon-pink-lg" id="tutup-komen">
            <button class="cursor-pointer bg-cyber-card hover:bg-cyber-dark text-pink-300 hover:text-white px-6 py-2.5 font-bold rounded-xl transition-colors duration-200 flex items-center gap-2" type="button">
                <i class="fa-solid fa-close"></i>
                Tutup Komentar
            </button>
        </div>
    </div>
    <div class="rounded-xl border border-cyan-500/30 bg-cyber-dark/60 p-5 mt-4 hidden shadow-neon-cyan-2xs" id="disqus_thread" data-disqus-shortname="{{ .Site.Params.disqusShortname | default "mydonghua" }}">
        <div class="text-center py-8 text-slate-400" id="disqus-loading">
            <i class="fa-solid fa-spinner fa-spin text-2xl text-cyan-400"></i>
            <p class="mt-3 text-sm">Memuat komentar...</p>
        </div>
        <div class="hidden text-center py-8" id="disqus-error">
            <i class="fa-solid fa-triangle-exclamation text-2xl text-amber-400"></i>
            <p class="mt-3 text-sm text-slate-300">Komentar tidak dapat dimuat.</p>
            <button class="mt-2 text-cyan-300 hover:text-cyan-200 underline underline-offset-2 text-sm" type="button" id="disqus-retry">Coba Lagi</button>
        </div>
    </div>
</div>
